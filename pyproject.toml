[project]
name = "specwright"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordy Nicholas", email = "JordyNCdaSilva@live.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
specwright = "specwright:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
