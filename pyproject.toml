[project]
name = "specwright"
version = "0.1.0"
description = "Multi-agent engineering SpecPack generator — AI Engineering study portfolio"
readme = "README.md"
authors = [
    { name = "Jordy Nicholas", email = "JordyNCdaSilva@live.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "apps/api/src"
module-name = "specwright"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["specwright"]
mypy_path = "apps/api/src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api/src"]
