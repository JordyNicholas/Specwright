name: ci

on:
  push:
    branches: [main, u0-scaffold]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.17"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install and check
        run: |
          make setup
          make check
